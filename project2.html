<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>volunteer management system</title>
     <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        />
    </head>
    <body>
        <div class="container mt-3">
            <h2 class="text-center mb-5">volunteer management system</h2>
            <div class="p-4">
                <form id="VolunteerForm">
                    <label for="name" class="form-label">full name</label>
                    <input type="text" id="name" class="form-control" required/>
                    <label for="email" class="form-label">email</label>
                    <input type="email" id="email" class="form-control" required/>
                    <label for="phone" class="form-label">phone number</label>
                    <input type="tel" id="phone" class="form-control" required/>
                    <label for="availability" class="form-label">availability</label>
                    <select id = "availability" class="form-select" required>
                        <option value="">Choose availability...</option>
                        <option value="weekdays">weekdays</option>
                        <option value="weekends">weekends</option>
                        <option value="both">both</option>
                    </select>
                    <label for="perferredRole" class="form-label" required>perferred role</label>
                    <select id ="perferredRole" class="form-select" required>
                        <option>
                            <option value="">Choose perferred role</option>
                            <option value="registration">registration</option>
                            <option value="event support">event support</option>
                            <option value="food">food</option>
                            <option value="clean up crew">clean up crew</option>
                        </option>
                    </select>
                    <label for="status" class="form-label" required>status</label>
                    <select id ="status" class="form-select" required>
                    <option> 
                        <option value="">status</option>
                        <option value="active">active</option>
                        <option value="inactive">inactive</option>
                    </option>
                    </select>
                    <button type="submit" class="btn btn-primary mt-3 w-50">
                        save volunteer
                    </button>
                </form>
                <div id="message" class="mt-4">
                </div>
                <div class="card p-4 mt-4">
                    <h4 class="mb-3">volunteer records</h4>
                    <div class="table-responsive">
                        <table class=" table table-borderd table-striped">
                            <thead>
                                <tr>
                                    <th>full name</th>
                                    <th>Email</th>
                                    <th>phone number</th>
                                    <th>availability</th>
                                    <th>perferred role</th>
                                    <th>status</th>
                                    <th>actions</th>
                                </tr>
                            </thead>
                            <tbody id="volunteerRows"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <script type="moudle" src="js/app.js"></script>
    </body>
    </html>
