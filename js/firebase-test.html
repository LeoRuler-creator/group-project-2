ii<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Firebase Database Test</title>
  </head>
  <body>
    <h1>Firebase Database Test</h1>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button id="loginBtn">Login</button>
    <button id="logoutBtn">Logout</button>
    <button id="readBtn">Read Data</button>
    <button id="writeBtn">Write Data</button>

    <p id="status">Please log in.</p>
    <pre id="result"></pre>

    <script type="module">
      import { db, auth } from "./firebase-config.js";

      import {
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

      import {
        ref,
        get,
        push,
        set,
      } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

      const status = document.getElementById("status");
      const result = document.getElementById("result");

      // Check authentication status
      onAuthStateChanged(auth, (user) => {
        if (user) {
          status.textContent = "Logged in: " + user.email;
        } else {
          status.textContent = "Please log in.";
          result.textContent = "";
        }
      });

      // Login test
      document.getElementById("loginBtn").onclick = async () => {
        status.textContent = "Logging in...";

        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password,
          );

          status.textContent = "Login successful: " + userCredential.user.email;

          console.log("Login successful:", userCredential.user.email);
        } catch (error) {
          status.textContent = "Login failed: " + error.message;
          console.error("Login error:", error);
        }
      };

      // Logout test
      document.getElementById("logoutBtn").onclick = async () => {
        try {
          await signOut(auth);

          status.textContent = "Logout successful!";
          result.textContent = "";
        } catch (error) {
          status.textContent = "Logout failed: " + error.message;
          console.error("Logout error:", error);
        }
      };

      // Read test
      document.getElementById("readBtn").onclick = async () => {
        try {
          const snapshot = await get(ref(db, "volunteers"));

          result.textContent = JSON.stringify(snapshot.val(), null, 4);
          status.textContent = "Read successful!";
        } catch (error) {
          status.textContent = "Read failed: " + error.message;
          console.error("Read error:", error);
        }
      };

      // Write test
      document.getElementById("writeBtn").onclick = async () => {
        try {
          const volunteerRef = push(ref(db, "volunteers"));

          await set(volunteerRef, {
            fullName: "Test Volunteer",
            email: "volunteer@example.com",
            phoneNumber: "519-555-0103",
            availability: "Weekends",
            preferredRole: "Food Distribution",
            status: "Active",
          });

          status.textContent = "Write successful!";
        } catch (error) {
          status.textContent = "Write failed: " + error.message;
          console.error("Write error:", error);
        }
      };
    </script>
  </body>
</html>
